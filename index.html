<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MarketPulse Crypto Tracker</title>

  <!-- Browser tab icon, Font Awesome icons, and Tailwind CSS -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Run JavaScript after the HTML has been parsed -->
  <script src="script.js" defer></script>
</head>

<body class="min-w-[960px] bg-white font-sans text-slate-900">

  <!-- Header with brand, navigation, and refresh button -->
  <header class="border-b border-slate-200">
    <div class="mx-auto flex max-w-6xl items-center gap-10 px-8 py-4">
      <span class="flex items-center gap-3 text-lg font-bold">
        <img src="favicon.png" alt="" class="size-8 rounded-md">
        MarketPulse
      </span>

      <nav aria-label="Tracker views" class="flex gap-2 text-sm font-medium">
        <button
          id="marketNav"
          type="button"
          aria-pressed="true"
          class="cursor-pointer rounded-md px-3 py-2 text-slate-600 hover:bg-slate-50 aria-pressed:bg-slate-100 aria-pressed:text-slate-900"
        >
          Markets
        </button>

        <button
          id="watchlistNav"
          type="button"
          aria-pressed="false"
          class="cursor-pointer rounded-md px-3 py-2 text-slate-600 hover:bg-slate-50 aria-pressed:bg-slate-100 aria-pressed:text-slate-900"
        >
          Watchlist
          <span id="watchCount" class="ml-1 text-slate-500">0</span>
        </button>
      </nav>

      <div class="ml-auto flex items-center gap-4">
        <span id="lastUpdated" class="text-xs text-slate-500"></span>

        <button
          id="refreshBtn"
          type="button"
          class="cursor-pointer rounded-md border border-slate-200 px-3 py-2 text-sm font-medium hover:bg-slate-50 disabled:opacity-50"
        >
          <i class="fa-solid fa-rotate-right mr-1.5" aria-hidden="true"></i>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-8 py-10">
    <h1 class="text-3xl font-semibold tracking-tight">Crypto market</h1>

    <p class="mt-2 text-sm text-slate-600">
      Track the top 20 cryptocurrencies by market cap. Prices are in USD.
    </p>

    <!-- Summary values are updated by JavaScript -->
    <dl class="mt-7 grid grid-cols-3 divide-x divide-slate-200 rounded-lg border border-slate-200 bg-slate-50">
      <div class="px-5 py-4">
        <dt class="text-sm text-slate-600">Coins tracked</dt>
        <dd id="totalCoins" class="mt-1 text-xl font-semibold tabular-nums">—</dd>
      </div>

      <div class="px-5 py-4">
        <dt class="text-sm text-slate-600">
          Top coin
          <span id="topCoinName" class="ml-1 font-medium text-slate-900"></span>
        </dt>
        <dd id="topCoin" class="mt-1 text-xl font-semibold tabular-nums">—</dd>
      </div>

      <div class="px-5 py-4">
        <dt class="text-sm text-slate-600">Saved coins</dt>
        <dd id="watchTotal" class="mt-1 text-xl font-semibold tabular-nums">0</dd>
      </div>
    </dl>

    <section
      class="mt-8 overflow-hidden rounded-lg border border-slate-200"
      aria-labelledby="sectionTitle"
    >
      <!-- Search and sort controls -->
      <div class="flex items-center justify-between gap-4 px-5 py-4">
        <h2 id="sectionTitle" class="text-lg font-semibold">
          Top cryptocurrencies
        </h2>

        <div class="flex gap-3 text-sm">
          <label class="relative">
            <span class="sr-only">Search coins</span>
            <i
              class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"
              aria-hidden="true"
            ></i>

            <input
              id="searchInput"
              type="search"
              placeholder="Search name or symbol"
              class="w-56 rounded-md border border-slate-200 py-2 pl-9 pr-3 focus:outline-2 focus:outline-slate-500"
            >
          </label>

          <label>
            <span class="sr-only">Sort coins</span>

            <select
              id="sortSelect"
              class="rounded-md border border-slate-200 bg-white px-3 py-2"
            >
              <option value="market_cap">Market cap</option>
              <option value="price_high">Price: high to low</option>
              <option value="price_low">Price: low to high</option>
              <option value="change_high">24h change: high to low</option>
              <option value="change_low">24h change: low to high</option>
            </select>
          </label>
        </div>
      </div>

      <!-- Coin table -->
      <table class="w-full text-sm">
        <thead class="border-y border-slate-200 bg-slate-50 text-slate-600">
          <tr>
            <th scope="col" class="w-2/5 px-5 py-3 text-left font-medium">Coin</th>
            <th scope="col" class="w-1/5 px-4 py-3 text-right font-medium">Price</th>
            <th scope="col" class="px-4 py-3 text-right font-medium">24h change</th>
            <th scope="col" class="px-4 py-3 text-right font-medium">Market cap</th>
            <th scope="col" class="px-5 py-3 text-center font-medium">Save</th>
          </tr>
        </thead>

        <!-- JavaScript inserts the coin rows here -->
        <tbody id="coinList" class="divide-y divide-slate-100"></tbody>

        <!-- Skeleton rows appear here while the API request runs -->
        <tbody
          id="loadingRows"
          class="animate-pulse divide-y divide-slate-100 motion-reduce:animate-none"
          hidden
        ></tbody>

        <!-- Status message for errors, empty data, or no search results -->
        <tbody id="statusRow" hidden>
          <tr>
            <td colspan="5" class="px-5 py-12 text-center">
              <p id="statusMessage" role="status" class="text-slate-600"></p>

              <button
                id="retryBtn"
                type="button"
                class="mt-3 cursor-pointer rounded-md bg-slate-900 px-4 py-2 text-white hover:bg-slate-700"
                hidden
              >
                Try Again
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

    <footer class="mt-4 text-right text-xs text-slate-500">
      Market data from CoinGecko
    </footer>
  </main>

  <!-- JavaScript copies this template once for each coin -->
  <template id="coinTemplate">
    <tr class="hover:bg-slate-50">
      <td class="px-5 py-3">
        <!-- Clicking the coin name opens its details -->
        <button
          type="button"
          data-coin-details
          class="flex cursor-pointer items-center gap-3 text-left hover:underline"
        >
          <img alt="" class="size-7 shrink-0 rounded-full">
          <span data-coin-name class="font-semibold"></span>
          <span data-coin-symbol class="text-xs text-slate-500"></span>
        </button>
      </td>

      <td data-coin-price class="px-4 py-3 text-right font-medium tabular-nums"></td>
      <td data-coin-change class="px-4 py-3 text-right tabular-nums"></td>
      <td data-coin-cap class="px-4 py-3 text-right tabular-nums text-slate-600"></td>

      <td class="px-5 py-3 text-center">
        <button
          type="button"
          data-coin-save
          class="size-8 cursor-pointer rounded-md text-slate-500 hover:bg-slate-100 aria-pressed:text-amber-600"
        >
          <i class="fa-star" aria-hidden="true"></i>
        </button>
      </td>
    </tr>
  </template>

  <!-- JavaScript copies this placeholder row into loadingRows -->
  <template id="skeletonTemplate">
    <tr aria-hidden="true">
      <td class="px-5 py-3">
        <div class="flex items-center gap-3">
          <span class="size-7 rounded-full bg-slate-200"></span>
          <span class="h-3 w-24 rounded bg-slate-200"></span>
        </div>
      </td>

      <td class="px-4 py-3">
        <div class="ml-auto h-3 w-16 rounded bg-slate-200"></div>
      </td>

      <td class="px-4 py-3">
        <div class="ml-auto h-3 w-12 rounded bg-slate-200"></div>
      </td>

      <td class="px-4 py-3">
        <div class="ml-auto h-3 w-16 rounded bg-slate-200"></div>
      </td>

      <td class="px-5 py-3">
        <div class="mx-auto size-4 rounded bg-slate-200"></div>
      </td>
    </tr>
  </template>

  <!-- Coin details popup -->
  <dialog
    id="detailModal"
    aria-labelledby="detailName"
    class="m-auto w-96 rounded-lg border border-slate-200 bg-white p-6 text-slate-900 shadow-lg backdrop:bg-slate-900/30"
  >
    <div class="flex items-center gap-3">
      <img id="detailImage" alt="" class="size-9 rounded-full">

      <div>
        <h2 id="detailName" class="font-semibold"></h2>
        <p id="detailSymbol" class="text-xs text-slate-500"></p>
      </div>

      <!-- This form closes the popup when the button is clicked -->
      <form method="dialog" class="ml-auto">
        <button
          type="submit"
          aria-label="Close details"
          class="size-8 cursor-pointer rounded-md hover:bg-slate-100"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </form>
    </div>

    <p id="detailPrice" class="mt-5 text-2xl font-semibold"></p>
    <p id="detailChange" class="mt-1 text-sm"></p>

    <dl class="mt-5 space-y-3 border-t border-slate-200 pt-4 text-sm">
      <div class="flex justify-between">
        <dt>Market cap</dt>
        <dd id="detailCap"></dd>
      </div>

      <div class="flex justify-between">
        <dt>24h high</dt>
        <dd id="detailHigh"></dd>
      </div>

      <div class="flex justify-between">
        <dt>24h low</dt>
        <dd id="detailLow"></dd>
      </div>

      <div class="flex justify-between">
        <dt>24h volume</dt>
        <dd id="detailVolume"></dd>
      </div>
    </dl>
  </dialog>

  <!-- Temporary message when a coin is saved or removed -->
  <div
    id="toast"
    role="status"
    class="fixed bottom-6 right-6 rounded-md bg-slate-900 px-4 py-3 text-sm text-white empty:hidden"
  ></div>

</body>
</html>
