<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketPulse Crypto Tracker</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="script.js" defer></script>
</head>

<body class="min-w-[960px] bg-white font-sans text-slate-900">

  <!-- Header and navigation -->
  <header class="border-b border-slate-200">
    <div class="mx-auto flex max-w-6xl items-center gap-10 px-8 py-4">
      <span class="flex items-center gap-3 text-lg font-bold">
        <img src="favicon.png" alt="" class="size-8 rounded-md">
        MarketPulse
      </span>

      <nav aria-label="Tracker views" class="flex gap-2 text-sm font-medium">
        <button id="marketNav" type="button" aria-pressed="true"
          class="cursor-pointer rounded-md px-3 py-2 hover:bg-slate-50 aria-pressed:bg-slate-100">
          Markets
        </button>

        <button id="watchlistNav" type="button" aria-pressed="false"
          class="cursor-pointer rounded-md px-3 py-2 hover:bg-slate-50 aria-pressed:bg-slate-100">
          Watchlist <span id="watchCount" class="ml-1 text-slate-500">0</span>
        </button>
      </nav>

      <div class="ml-auto flex items-center gap-4">
        <span id="lastUpdated" class="text-xs text-slate-500"></span>

        <button id="refreshBtn" type="button"
          class="cursor-pointer rounded-md border border-slate-200 px-3 py-2 text-sm hover:bg-slate-50 disabled:opacity-50">
          <i class="fa-solid fa-rotate-right mr-1" aria-hidden="true"></i>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-8 py-10">
    <h1 class="text-3xl font-semibold">Crypto market</h1>
    <p class="mt-2 text-sm text-slate-600">
      Track the top 20 cryptocurrencies by market cap. Prices are in USD.
    </p>

    <!-- Market summary -->
    <dl class="mt-7 grid grid-cols-3 divide-x divide-slate-200 rounded-lg border border-slate-200 bg-slate-50">
      <div class="px-5 py-4">
        <dt class="text-sm text-slate-600">Coins tracked</dt>
        <dd id="totalCoins" class="mt-1 text-xl font-semibold">—</dd>
      </div>

      <div class="px-5 py-4">
        <dt class="text-sm text-slate-600">
          Top coin <span id="topCoinName" class="ml-1 font-medium"></span>
        </dt>
        <dd id="topCoin" class="mt-1 text-xl font-semibold">—</dd>
      </div>

      <div class="px-5 py-4">
        <dt class="text-sm text-slate-600">Saved coins</dt>
        <dd id="watchTotal" class="mt-1 text-xl font-semibold">0</dd>
      </div>
    </dl>

    <section class="mt-8 rounded-lg border border-slate-200" aria-labelledby="sectionTitle">

      <!-- Search and sort controls -->
      <div class="flex items-center justify-between gap-4 px-5 py-4">
        <h2 id="sectionTitle" class="text-lg font-semibold">Top 20 Cryptocurrencies</h2>

        <div class="flex items-center gap-3 text-sm">
          <label class="relative">
            <span class="sr-only">Search coins</span>
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"
              aria-hidden="true"></i>
            <input id="searchInput" type="search" placeholder="Search name or symbol"
              class="w-56 rounded-md border border-slate-200 py-2 pl-9 pr-3">
          </label>

          <details class="relative">
            <summary class="cursor-pointer rounded-md border border-slate-200 px-3 py-2">
              Sort by
            </summary>

            <ul id="sortOptions" class="absolute right-0 z-10 mt-2 w-48 space-y-2 rounded-md border border-slate-200 bg-white p-3 shadow">
              <li><label><input type="radio" name="sort" value="market_cap" checked> Market Cap</label></li>
              <li><label><input type="radio" name="sort" value="price_high"> Highest Price</label></li>
              <li><label><input type="radio" name="sort" value="price_low"> Lowest Price</label></li>
              <li><label><input type="radio" name="sort" value="change_high"> Top Gainers</label></li>
              <li><label><input type="radio" name="sort" value="change_low"> Top Losers</label></li>
            </ul>
          </details>
        </div>
      </div>

      <!-- Coin table, loading state, and retry message -->
      <table class="w-full text-sm">
        <thead class="border-y border-slate-200 bg-slate-100 text-slate-700">
          <tr>
            <th scope="col" class="w-2/5 px-5 py-3 text-left font-semibold">Coin</th>
            <th scope="col" class="w-1/5 px-4 py-3 text-right font-semibold">Price (USD)</th>
            <th scope="col" class="px-4 py-3 text-right font-semibold">24h Change</th>
            <th scope="col" class="px-4 py-3 text-right font-semibold">Market Cap</th>
            <th scope="col" class="px-5 py-3 text-center font-semibold">Watchlist</th>
          </tr>
        </thead>

        <tbody id="coinList" class="divide-y divide-slate-100"></tbody>

        <tbody id="loadingRows" class="animate-pulse divide-y divide-slate-100 motion-reduce:animate-none" hidden></tbody>

        <tbody id="statusRow" hidden>
          <tr>
            <td colspan="5" class="px-5 py-12 text-center">
              <p id="statusMessage" role="status" class="text-slate-600"></p>
              <button id="retryBtn" type="button"
                class="mt-3 cursor-pointer rounded-md bg-slate-900 px-4 py-2 text-white hover:bg-slate-700" hidden>
                Try Again
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

    <footer class="mt-4 text-right text-xs text-slate-500">
      Market data from CoinGecko
    </footer>
  </main>

  <!-- JavaScript copies this row for each coin -->
  <template id="coinTemplate">
    <tr class="hover:bg-slate-50">
      <td class="px-5 py-3">
        <div class="flex items-center gap-3">
          <img alt="" class="size-7 rounded-full">
          <span data-coin-name class="font-semibold"></span>
          <span data-coin-symbol class="text-xs text-slate-500"></span>
        </div>
      </td>

      <td data-coin-price class="px-4 py-3 text-right font-medium tabular-nums"></td>
      <td data-coin-change class="px-4 py-3 text-right tabular-nums"></td>
      <td data-coin-cap class="px-4 py-3 text-right tabular-nums text-slate-600"></td>

      <td class="px-5 py-3 text-center">
        <button type="button" data-coin-save
          class="size-8 cursor-pointer rounded-md text-slate-500 hover:bg-slate-100 aria-pressed:text-amber-600">
          <i class="fa-star" aria-hidden="true"></i>
        </button>
      </td>
    </tr>
  </template>

  <!-- Placeholder row shown while data loads -->
  <template id="skeletonTemplate">
    <tr aria-hidden="true">
      <td class="px-5 py-4">
        <div class="flex items-center gap-3">
          <span class="size-7 rounded-full bg-slate-200"></span>
          <span class="h-3 w-24 rounded bg-slate-200"></span>
        </div>
      </td>
      <td class="px-4 py-4"><div class="ml-auto h-3 w-16 rounded bg-slate-200"></div></td>
      <td class="px-4 py-4"><div class="ml-auto h-3 w-12 rounded bg-slate-200"></div></td>
      <td class="px-4 py-4"><div class="ml-auto h-3 w-16 rounded bg-slate-200"></div></td>
      <td class="px-5 py-4"><div class="mx-auto size-4 rounded bg-slate-200"></div></td>
    </tr>
  </template>

  <!-- Message shown after saving or removing a coin -->
  <div id="toast" role="status"
    class="fixed bottom-6 right-6 rounded-md bg-slate-900 px-4 py-3 text-sm text-white empty:hidden"></div>

</body>
</html>
